syntax = "proto3";
package io.altessa.serviceinfo.v1;

option java_package = "io.altessa.serviceinfo.v1";
option java_outer_classname = "ServiceInfoServiceProto";
option java_multiple_files = true;

option go_package = "github.com/altessa-s/proto-gen-go/io/altessa/serviceinfo/v1;serviceinfov1";

import "io/altessa/serviceinfo/v1/serviceinfo.proto";

// Provides runtime information about the service instance. Implementations
// MUST treat `GetServiceInfo` as idempotent and side-effect-free; it is safe to call
// from health probes and load balancers, and safe to expose via gRPC
// reflection.
//
// Registration order matters in some setups: register
// `ServiceInfoService` before gRPC reflection so reflection-based
// tooling (grpcurl, Postman, evans) can discover the method without an
// extra `.proto` import.
service ServiceInfoService {
  // Returns the current `ServiceInfo` snapshot for the instance handling
  // the call. Cheap — implementations SHOULD compute the response from
  // cached values and only re-evaluate time-shaped fields (`uptime`,
  // leadership state) on demand.
  rpc GetServiceInfo(GetServiceInfoRequest) returns (GetServiceInfoResponse);
}

// Request for the `GetServiceInfo` method. `ServiceInfo` is a per-connection
// singleton — the instance answering the call — so there is no `name` to
// address. The message is intentionally empty for now and exists (instead
// of `google.protobuf.Empty`) so read options such as a
// `google.protobuf.FieldMask` can be added later without changing the RPC
// signature.
message GetServiceInfoRequest {}

// Response for the `GetServiceInfo` method: a wrapper around the
// `ServiceInfo` snapshot. A dedicated response message (rather than
// returning `ServiceInfo` directly) leaves room to add sibling fields
// later without a breaking change.
message GetServiceInfoResponse {
  // Runtime information for the instance handling the call.
  ServiceInfo service_info = 1;
}
